[project]
name = "agent-3"
version = "0.1.0"
description = "Agent 3 planning service scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fasta2a>=0.6,<0.7",
    "httpx>=0.28,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9.0",
    "ruff>=0.12,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent3"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
