name: Agent 3 Validation

on:
  push:
    paths:
      - ".github/workflows/agent-3-validation.yml"
      - "services/agent-3/**"
      - "services/agent-3-mcp/**"
  pull_request:
    paths:
      - ".github/workflows/agent-3-validation.yml"
      - "services/agent-3/**"
      - "services/agent-3-mcp/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/agent-3
          - services/agent-3-mcp

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest
