version: "3.9"

services:
  agent4:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent4_food_recommender

    ports:
      - "${AGENT_HOST:-0.0.0.0}:${AGENT_PORT:-8004}:8004"

    # All secrets injected via .env — nothing hardcoded.
    # OpenRouter + Google Places are both plain API keys, so no
    # service-account JSON volumes are needed anymore.
    env_file:
      - .env

    environment:
      AGENT3_URL: http://localhost:8003

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD", "python", "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8004/.well-known/agent.json')"
        ]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
